name: Build & Publish AriaBox Docker Image

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Git tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Beautiful Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Find the previous tag, or use the very first commit if this is the first release
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)

          # Get commit messages and author names, excluding merge commits
          COMMITS=$(git log --pretty=format:"%s||%an" --no-merges ${PREV_TAG}..HEAD)

          # Initialize categories
          FEATURES=""
          FIXES=""
          DOCS=""
          MAINTENANCE=""
          GENERAL=""

          # Sort commits into categories
          while IFS='||' read -r commit author; do
            [ -z "$commit" ] && continue

            if [[ "$commit" == feat:* ]] || [[ "$commit" == feat\(*\):* ]]; then
              msg="${commit#feat: }"
              msg="${msg#feat(*): }"
              FEATURES="${FEATURES}- ${msg} by **${author}**\n"
            elif [[ "$commit" == fix:* ]] || [[ "$commit" == fix\(*\):* ]]; then
              msg="${commit#fix: }"
              msg="${msg#fix(*): }"
              FIXES="${FIXES}- ${msg} by **${author}**\n"
            elif [[ "$commit" == docs:* ]] || [[ "$commit" == docs\(*\):* ]]; then
              msg="${commit#docs: }"
              msg="${msg#docs(*): }"
              DOCS="${DOCS}- ${msg} by **${author}**\n"
            elif [[ "$commit" == chore:* ]] || [[ "$commit" == chore\(*\):* ]]; then
              msg="${commit#chore: }"
              msg="${msg#chore(*): }"
              MAINTENANCE="${MAINTENANCE}- ${msg} by **${author}**\n"
            elif [[ "$commit" == style:* ]] || [[ "$commit" == style\(*\):* ]]; then
              msg="${commit#style: }"
              msg="${msg#style(*): }"
              MAINTENANCE="${MAINTENANCE}- ${msg} by **${author}**\n"
            else
              GENERAL="${GENERAL}- ${commit} by **${author}**\n"
            fi
          done <<< "$COMMITS"

          # Build grouped markdown
          echo "## What's New in AriaBox ${TAG_NAME}" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$FEATURES" ]; then
            echo "### 🌸 New Features" >> release_notes.md
            echo -e "$FEATURES" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> release_notes.md
            echo -e "$FIXES" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$DOCS" ]; then
            echo "### 📝 Documentation" >> release_notes.md
            echo -e "$DOCS" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$MAINTENANCE" ]; then
            echo "### 🎀 Maintenance & Chores" >> release_notes.md
            echo -e "$MAINTENANCE" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ -n "$GENERAL" ]; then
            echo "### 🍥 General Updates" >> release_notes.md
            echo -e "$GENERAL" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Add disclaimer and full changelog link
          echo "> *Note: Contributor names are based on Git commit authors and may not match GitHub usernames. For accurate GitHub profile links, please check the commit history.*" >> release_notes.md
          echo "" >> release_notes.md
          echo "*Full Changelog: ${PREV_TAG}...${TAG_NAME}*" >> release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "AriaBox ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            --draft=false
