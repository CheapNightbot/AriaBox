services:
  ariabox:
    image: ghcr.io/cheapnightbot/ariabox:latest
    container_name: ariabox
    # Defaults to 1000:1000 for secure Rootful Docker.
    # Rootless users can override this to 0:0 via their .env file!
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # The right side MUST match HOST_PORT variable!
      - "${HOST_PORT:-8960}:8960"
    volumes:
      # The right side MUST match DATA_DIR variable!
      # `:z` is for Linux with SELinux active
      - ./data:${DATA_DIR:-/app/data}:z
    environment:
      # These pull from the .env file, falling back to defaults if missing
      - DATA_DIR=${DATA_DIR:-/app/data}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - DEFAULT_LOCATION=${DEFAULT_LOCATION:-US}
      - HOST_URL=${HOST_URL:-0.0.0.0}
      - HOST_PORT=${HOST_PORT:-8960}
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
